[package]
name = "codex-studio"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
anyhow = "1.0"
keyring = "2.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls", "serde"] }
rusqlite = { version = "0.29", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tauri = { version = "1.5", features = ["api-all"] }
tokio = { version = "1.32", features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util"] }
uuid = { version = "1.5", features = ["v4"] }
